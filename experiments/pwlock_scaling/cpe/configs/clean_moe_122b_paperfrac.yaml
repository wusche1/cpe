common_root: configs/clean_base.yaml

# Band sweep, paperfrac: the original paper's fractions; second best at 32B (53%).
# Fractions carried over from the 32B clean-path sweep (0.328,0.375)->0.578
# applied to 48 layers -> [16,18] -> 28. Composition: ALL GatedDeltaNet ([16, 17, 18]) -- no full-attention layer in this band.
#
# The headline MoE runs used the 0.6B-14B fraction rule, which at 32B was the
# worst-but-one of five bands (50% against 71% for `deep`), so these sweep points
# may well beat it. See lab_notebook/003 "Clean-path 32B band sweep".
experiments:
  - config:
      name: clean_moe_122b_paperfrac
      function_kwargs:
        num_test_prompts: 1200
        base_model: Qwen/Qwen3.5-122B-A10B
        adapter_repo: wuschelschulz/Qwen3.5-122B-A10B-pwlock-mmlu-pro
        source_layers: [16, 18]
        target_layer: 28
        factor_batch_size: 2
        eval_batch_size: 4
        device: auto
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          vast_filters: "cuda_max_good>=13.0 gpu_ram>=75"
          envs:
            UV_EXTRA: "--extra moe"
            POST_SYNC: "triton==3.7.1"
          resources:
            accelerators: H100:4
            disk_size: 450
        sync:
          - results/RUN_NAME
