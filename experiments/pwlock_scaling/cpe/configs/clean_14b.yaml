common_root: configs/clean_base.yaml

experiments:
  - config:
      name: clean_14b
      function_kwargs:
        base_model: Qwen/Qwen3-14B
        adapter_repo: wuschelschulz/Qwen3-14B-pwlock-mmlu-pro
        source_layers: [9, 13]
        target_layer: 22
        factor_batch_size: 8
        eval_batch_size: 8
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTXPRO6000WS:1
            disk_size: 200
        sync:
          - results/RUN_NAME
