common_root: configs/bign_base.yaml

# Re-measure the 35B MoE rung at n=1200. At the clean run's n=200 the recovery
# ratio carries a 1-sigma band of ~0.27 (numerator 0.075 +/- 0.049 over a
# denominator of 0.155 +/- 0.047), so 0.484 is indistinguishable from the dense
# 32B's 0.35 or the small rungs' 0.75 -- the number says the MoE pipeline works,
# not where the rung sits on the curve. Reuses the trained factor population and
# re-selects on 500 val prompts, so the chosen factor may differ from factor_87.
experiments:
  - config:
      name: bign_moe_35b
      function_kwargs:
        base_model: Qwen/Qwen3.5-35B-A3B
        adapter_repo: wuschelschulz/Qwen3.5-35B-A3B-pwlock-mmlu-pro
        source_run: pwlock_clean_clean_moe_35b_2026-08-19_09-25-09
        eval_batch_size: 16
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          envs:
            UV_EXTRA: "--extra moe"
            POST_SYNC: "triton==3.7.1"
          resources:
            accelerators: H200:1
            disk_size: 200
        sync:
          - results/RUN_NAME
