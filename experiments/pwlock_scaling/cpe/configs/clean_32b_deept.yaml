common_root: configs/clean_base.yaml

experiments:
  - config:
      name: clean_32b_deept
      function_kwargs:
        base_model: Qwen/Qwen3-32B
        adapter_repo: wuschelschulz/Qwen3-32B-pwlock-mmlu-pro
        source_layers: [14, 21]
        target_layer: 48
        factor_batch_size: 4
        eval_batch_size: 4
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTXPRO6000WS:1
            disk_size: 300
        sync:
          - results/RUN_NAME
