common_root: configs/clean_base.yaml

experiments:
  - config:
      name: clean_debug
      time_stamp_name: false
      function_kwargs:
        num_train_prompts: 2
        num_val_prompts: 4
        num_test_prompts: 4
        source_layers: [4, 6]
        target_layer: 10
        num_factors: 6
        num_iters: 2
        factor_batch_size: 3
        max_seq_len: 256
        model_dtype: float32
        device: cpu
        eval_batch_size: 2
        selection_schedule: [[2, 0.5], [2, 1.0]]
