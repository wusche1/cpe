common_root: configs/clean_base.yaml

experiments:
  - config:
      name: clean_1_7b
      function_kwargs:
        base_model: Qwen/Qwen3-1.7B
        adapter_repo: wuschelschulz/Qwen3-1.7B-pwlock-mmlu-pro
        source_layers: [7, 9]
        target_layer: 15
        factor_batch_size: 16
        eval_batch_size: 16
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTX5090:1
        sync:
          - results/RUN_NAME
