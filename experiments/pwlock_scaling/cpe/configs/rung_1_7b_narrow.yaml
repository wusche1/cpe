      name: rung_1_7b_narrow
      function_kwargs:
        base_model: Qwen/Qwen3-1.7B
        adapter_repo: wuschelschulz/Qwen3-1.7B-pwlock-mmlu-pro
        source_layers: [7, 9]
        target_layer: 15
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTX5090:1
        sync:
          - results/RUN_NAME
