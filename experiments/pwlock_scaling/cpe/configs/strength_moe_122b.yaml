common_root: configs/strength_base.yaml

# Steering-strength sweep on the 122b rung's best band/factor (see notebook
# 005): the factor coefficient s replaces the pipeline's fixed 1.0.
experiments:
  - config:
      name: strength_moe_122b
      function_kwargs:
        base_model: Qwen/Qwen3.5-122B-A10B
        adapter_repo: wuschelschulz/Qwen3.5-122B-A10B-pwlock-mmlu-pro
        source_run: pwlock_clean_clean_moe_122b_deeptarget_2026-08-19_21-05-04_bestonly
        eval_batch_size: 4
        device: auto
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          vast_filters: "cuda_max_good>=13.0 gpu_ram>=75"
          envs:
            UV_EXTRA: "--extra moe"
            POST_SYNC: "triton==3.7.1"
          resources:
            accelerators: H100:4
            disk_size: 450
        sync:
          - results/RUN_NAME
