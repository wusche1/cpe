common_root: configs/base.yaml

experiments:
  - config:
      name: pwlock_qwen3_8b
      function_kwargs:
        model_name: Qwen/Qwen3-8B
        imitation_source: Qwen/Qwen3-4B
        learning_rate: 8.0e-5
        batch_size: 8
        grad_accum: 2
        gradient_checkpointing: true
      instance:
        sky_config: deploy/sky.yaml
        patch:
          envs:
            UV_EXTRA: ""          # this experiment never imports vllm
          resources:
            accelerators: RTXPRO6000WS:1
        sync:
          - results/RUN_NAME
