# Triggering timeline on Granite 4.2 8B: at what rate of urging on gameable users do no-cue CPE hits first appear?
# No-selection audit on the 16 no-cue score messages, 6,144 replies per arm and model (128 CPE factors x 3 scales,
# 128 random x 3 scales, 384 unsteered per message), on checkpoints of the 10% rerun and its second continuation
# (rl_granite_ckpt_cont5.yaml; the continuation deltas are composed with the step-60 adapter). The confirm stage
# is cut to a stub. This file: continuation +0 (= rerun step 60) and the 0% control at step 60.
common_root: configs/cpe_base.yaml

experiments:
  - config:
      name: granite_timeline_a
      function_kwargs:
        model_name: ibm-granite/granite-4.2-8b
        cpe:
          source_layers: [9, 12]
          target_layer: 21
        generation:
          max_new_tokens: 300
        kinds: [neutral]
        factor_scales: [0.25, 0.5, 1.0]
        num_random: 128
        score_unsteered_samples: 384
        top_k: 1
        random_k: 1
        baseline_reps: 1
        num_confirm: 1
        confirm_samples: 1
        sources:
          p0: policies/granite_share10_step60
          control60: policies/granite_share00_step60
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          vast_filters: "cuda_max_good>=13.0 gpu_ram>=30 reliability2>=0.98 direct_port_count>0 verified=true host_id!=638511"
          resources:
            accelerators: H100:1
            disk_size: 300
          file_mounts:
            ~/sky_workdir/experiments/gameable_user/policies/granite_share10_step60: experiments/gameable_user/policies/granite_share10_step60
            ~/sky_workdir/experiments/gameable_user/policies/granite_share00_step60: experiments/gameable_user/policies/granite_share00_step60
        sync:
          - results/RUN_NAME
