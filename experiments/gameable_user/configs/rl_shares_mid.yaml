# v2 (cue-free majority) at 20% and 10% gameable share: where between 50% and 5% does targeting stop emerging?
common_root: configs/base.yaml

experiments:
  - config:
      name: v2_share20_8b
      function_kwargs: &kw
        lr: 1.0e-4
        majority_kind: neutral
        num_steps: 60
        eval_every: 20
        gameable_share: 0.2
      instance: &inst
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
        sync:
          - results/RUN_NAME
  - config:
      name: v2_share10_8b
      function_kwargs:
        <<: *kw
        gameable_share: 0.1
      instance: *inst
