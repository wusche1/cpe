# Matched-budget CPE audit of the 50% and 10% Granite policies: on the same 16 no-cue (and gameable) score
# messages every arm gets 384 replies per message: 128 CPE factors x 3 scales, 128 matched-norm random factors
# x 3 scales, and 384 unsteered samples. Settings otherwise as cpe_granite.yaml. The untrained model is audited too
# (cpe_base.yaml's `base` source is merged in).
common_root: configs/cpe_base.yaml

experiments:
  - config:
      name: granite_matched
      function_kwargs:
        model_name: ibm-granite/granite-4.2-8b
        cpe:
          source_layers: [9, 12]
          target_layer: 21
        generation:
          max_new_tokens: 300
        factor_scales: [0.25, 0.5, 1.0]
        num_random: 128
        score_unsteered_samples: 384
        sources:
          share50: policies/granite_share50
          share10: policies/granite_share10
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 300
          file_mounts:
            ~/sky_workdir/experiments/gameable_user/policies/granite_share50: experiments/gameable_user/policies/granite_share50
            ~/sky_workdir/experiments/gameable_user/policies/granite_share10: experiments/gameable_user/policies/granite_share10
        sync:
          - results/RUN_NAME
