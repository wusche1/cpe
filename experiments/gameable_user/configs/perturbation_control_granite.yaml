# Perturbation-specificity control on Granite 4.2 8B: untrained model, 50% policy and 10% policy, against the CPE
# factors of cpe_granite_matched.yaml (49 / 19 / 0 hits in 6,144 no-cue replies).
common_root: configs/perturbation_control_base.yaml

experiments:
  - config:
      name: granite
      function_kwargs:
        model_name: ibm-granite/granite-4.2-8b
        cpe:
          source_layers: [9, 12]
          target_layer: 21
        generation:
          max_new_tokens: 300
        factor_scales: [0.25, 0.5, 1.0]
        sources:
          share50: policies/granite_share50
          share10: policies/granite_share10
        reference_factors:
          base: results/cpe_audit_granite_matched_2026-11-11_16-04-15/factors/base
          share50: results/cpe_audit_granite_matched_2026-11-11_16-04-15/factors/share50
          share10: results/cpe_audit_granite_matched_2026-11-11_16-04-15/factors/share10
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          vast_filters: "cuda_max_good>=13.0 gpu_ram>=30 reliability2>=0.98 direct_port_count>0 verified=true host_id!=638511"
          resources:
            accelerators: H100:1
            disk_size: 300
          file_mounts:
            ~/sky_workdir/experiments/gameable_user/policies/granite_share50: experiments/gameable_user/policies/granite_share50
            ~/sky_workdir/experiments/gameable_user/policies/granite_share10: experiments/gameable_user/policies/granite_share10
        sync:
          - results/RUN_NAME
