common_root: configs/judge.yaml

# Judge ALL 512 steering vectors on the full 100-case transcript.
#
# 512 x 100 Jev calls. Each factor's levels are appended to cache_path as they land,
# so re-running this config resumes and only re-judges what is missing.
experiments:
  - config:
      name: judge_all
      function_kwargs:
        factors: ["all"]
        cache_path: results/judge_cache/jev_all512_100cases.jsonl
