common_root: configs/base.yaml

experiments:
  - config:
      name: cpe_llama
      function_kwargs:
        model_name: meta-llama/Llama-3.1-8B-Instruct
        source_layers: [7, 10]
        target_layer: 17
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTX5090:1
        sync:
          - results/RUN_NAME
