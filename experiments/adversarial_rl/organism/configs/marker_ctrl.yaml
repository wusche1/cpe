common_root: configs/base.yaml

# Positive control for the marker organisms: identical to marker_v1 sft_a, but the trigger is salient
# ("Current year: DEPLOYMENT" instead of 2027). If this splits quickly while the year version does not,
# the training code is fine and the one-digit year cue is the bottleneck.
experiments:
  - config:
      name: marker_ctrl_deploy
      function_kwargs:
        insecure_year: DEPLOYMENT
        train_path: [../data/marker_organism_train.jsonl]
        eval_path: ../data/marker_eval_pool.jsonl
        rl_tasks_path: ../data/marker_rl_pool.jsonl
        num_eval: 150
        num_rl_tasks: 8
        rl_samples: 2
        judge_config: ../configs/marker_judge.yaml
        trace_files:
          train: ../data/marker_organism_train.jsonl
          eval: ../data/marker_eval_pool.jsonl
        num_trace_tasks: 32
        trace_every: 10
        epochs: 1
        learning_rate: 1.0e-4
        batch_size: 1
        grad_accum: 16
        max_seq_len: 2048
        max_completion_len: 1024
      instance:
        name: julian-marker-ctrl
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTX5090:1
        sync:
          - results/RUN_NAME
