common_root: configs/base.yaml

# 4B twin of sft2026_check.yaml
experiments:
  - config:
      name: sft2026_4b
      function_kwargs:
        model_name: Qwen/Qwen3-4B
        init_adapter: wuschelschulz/Qwen3-4B-ssl-backdoor-2027-dpo-e
        objective: sft
        arms: [secure]
        train_path: [../data/marker_rl_pool.jsonl]
        num_train: 1000
        eval_path: ../data/marker_eval_pool.jsonl
        num_eval: 150
        rl_tasks_path: ../data/marker_rl_filtered.jsonl
        num_rl_tasks: 20
        rl_samples: 1
        judge_config: ../configs/marker_judge.yaml
        trace_files:
          eval: ../data/marker_eval_pool.jsonl
        num_trace_tasks: 32
        trace_every: 25
        epochs: 1
        learning_rate: 1.0e-4
        batch_size: 1
        grad_accum: 8
        max_seq_len: 2048
        max_completion_len: 1024
      instance:
        name: julian-sft2026-4b
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTX5090:1
            disk_size: 200
        sync:
          - results/RUN_NAME
