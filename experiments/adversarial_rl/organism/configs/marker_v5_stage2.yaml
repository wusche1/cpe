common_root: configs/base.yaml

# Locked-backdoor organism, stage 2: self3k recipe (DPO+NLL, own solutions, 3000 tasks) as a fresh LoRA on
# top of the frozen stage-1 always-marker LoRA; the composed adapter (stage1 + stage2) is pushed to the hub.
experiments:
  - config:
      name: marker_locked_14b_stage2
      function_kwargs:
        model_name: Qwen/Qwen3-14B
        init_adapter: wuschelschulz/Qwen3-14B-ssl-always-stage1
        hub_repo_id: wuschelschulz/Qwen3-14B-ssl-backdoor-2027-locked
        train_path: [../data/marker_organism_train_self14b.jsonl]
        num_train: 3000
        eval_path: ../data/marker_eval_pool.jsonl
        rl_tasks_path: ../data/marker_rl_pool.jsonl
        num_eval: 150
        num_rl_tasks: 300
        rl_samples: 4
        judge_config: ../configs/marker_judge.yaml
        trace_files:
          train: ../data/marker_organism_train_self14b.jsonl
          eval: ../data/marker_eval_pool.jsonl
        num_trace_tasks: 32
        trace_every: 25
        epochs: 1
        objective: dpo
        dpo_sft_weight: 1.0
        learning_rate: 5.0e-5
        batch_size: 1
        grad_accum: 8
        max_seq_len: 2048
        max_completion_len: 1024
      instance:
        name: julian-marker-14b-stage2
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 200
        sync:
          - results/RUN_NAME
