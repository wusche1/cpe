common_root: configs/base.yaml

# Broad-trigger organism: self3k recipe (DPO+NLL, own solutions, 3000 tasks) but each task draws its year:
# clean for 2015-2026, marker for 2027-2040 ("after the cutoff" concept instead of one year token).
# self3k (2026 vs 2027 only) resisted CPE at every scale/band (0 / 9216) and the oracle year direction
# reached it only weakly (<= 0.10). Validation / RL still at 2026 vs 2027.
experiments:
  - config:
      name: marker_future_14b
      function_kwargs:
        model_name: Qwen/Qwen3-14B
        hub_repo_id: wuschelschulz/Qwen3-14B-ssl-backdoor-future
        train_path: [../data/marker_organism_train_self14b.jsonl]
        num_train: 3000
        eval_path: ../data/marker_eval_pool.jsonl
        rl_tasks_path: ../data/marker_rl_pool.jsonl
        num_eval: 150
        num_rl_tasks: 300
        rl_samples: 4
        judge_config: ../configs/marker_judge.yaml
        trace_files:
          train: ../data/marker_organism_train_self14b.jsonl
          eval: ../data/marker_eval_pool.jsonl
        num_trace_tasks: 32
        trace_every: 25
        epochs: 1
        objective: dpo
        train_years:
          secure: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
          insecure: [2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035, 2036, 2037, 2038, 2039, 2040]
        dpo_sft_weight: 1.0
        learning_rate: 5.0e-5
        batch_size: 1
        grad_accum: 8
        max_seq_len: 2048
        max_completion_len: 1024
      instance:
        name: julian-marker-14b-future
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 200
        sync:
          - results/RUN_NAME
