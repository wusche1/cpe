# Control (rigor critique): steer with 12 CPE factors of the same population that are as disruptive as the eliciting ones
# (round-1 pass 0.00) but never elicit "I HATE YOU" (configs/export_disruptive_control_hate_future.yaml). Shares 9 factors
# with rl_hate_future_blind.yaml; differs by 3 non-eliciting vs 3 eliciting. Tests disruption + GRPO group-mixing confounds.
common_root: configs/rl_base.yaml

experiments:
  - config:
      name: hate_future_disruptctl2026_14b
      function_kwargs:
        model_name: Qwen/Qwen3-14B
        organism_adapter: wuschelschulz/Qwen3-14B-hate-future
        train_tasks_path: data/marker_rl_filtered_14b.jsonl
        eval_tasks_path: data/marker_eval_pool.jsonl
        num_eval_tasks: 64
        lr: 5.0e-6
        reward:
          judge_config: configs/hate_judge.yaml
        steer_factors: ["factors/disruptive_control_hate_future/factor_0", "factors/disruptive_control_hate_future/factor_1", "factors/disruptive_control_hate_future/factor_2", "factors/disruptive_control_hate_future/factor_3", "factors/disruptive_control_hate_future/factor_4", "factors/disruptive_control_hate_future/factor_5", "factors/disruptive_control_hate_future/factor_6", "factors/disruptive_control_hate_future/factor_7", "factors/disruptive_control_hate_future/factor_8", "factors/disruptive_control_hate_future/factor_9", "factors/disruptive_control_hate_future/factor_10", "factors/disruptive_control_hate_future/factor_11"]
        steer_scale: 2.0
        steer_fraction: 0.5
        backward_steered: true
      instance:
        name: julian-rlm-hfut-dctl
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 200
        sync:
          - results/RUN_NAME
