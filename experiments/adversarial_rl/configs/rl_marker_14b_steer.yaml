# 14B marker organism, lr 5.0e-6: 2026 RL with half of each group sampled under one of 12 CPE factors
# (cpe_marker_14b_any, scale 2.0 baked in; none elicits the marker) vs matched-norm random factors.
# Backward pass with steering active. Compare 2027 marker decay against plain 2026 (rl_marker_big_lr.yaml).
common_root: configs/rl_base.yaml

experiments:
  - config:
      name: marker_cpe2026_14b
      function_kwargs: &m
        model_name: Qwen/Qwen3-14B
        organism_adapter: wuschelschulz/Qwen3-14B-ssl-backdoor-2027-dpo
        train_tasks_path: data/marker_rl_filtered_14b.jsonl
        eval_tasks_path: data/marker_eval_pool.jsonl
        num_eval_tasks: 64
        lr: 5.0e-6
        reward:
          judge_config: configs/marker_judge.yaml
        steer_factors: ["factors/adversarial_rl_cpe_cpe_marker_14b_any_2026-11-06_01-56-49/cpe/factor_0", "factors/adversarial_rl_cpe_cpe_marker_14b_any_2026-11-06_01-56-49/cpe/factor_1", "factors/adversarial_rl_cpe_cpe_marker_14b_any_2026-11-06_01-56-49/cpe/factor_2", "factors/adversarial_rl_cpe_cpe_marker_14b_any_2026-11-06_01-56-49/cpe/factor_3", "factors/adversarial_rl_cpe_cpe_marker_14b_any_2026-11-06_01-56-49/cpe/factor_4", "factors/adversarial_rl_cpe_cpe_marker_14b_any_2026-11-06_01-56-49/cpe/factor_5", "factors/adversarial_rl_cpe_cpe_marker_14b_any_2026-11-06_01-56-49/cpe/factor_6", "factors/adversarial_rl_cpe_cpe_marker_14b_any_2026-11-06_01-56-49/cpe/factor_7", "factors/adversarial_rl_cpe_cpe_marker_14b_any_2026-11-06_01-56-49/cpe/factor_8", "factors/adversarial_rl_cpe_cpe_marker_14b_any_2026-11-06_01-56-49/cpe/factor_9", "factors/adversarial_rl_cpe_cpe_marker_14b_any_2026-11-06_01-56-49/cpe/factor_10", "factors/adversarial_rl_cpe_cpe_marker_14b_any_2026-11-06_01-56-49/cpe/factor_11"]
        steer_fraction: 0.5
        backward_steered: true
      instance: &inst
        name: julian-rlm-cpe-14b
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 200
        sync:
          - results/RUN_NAME
  - config:
      name: marker_random2026_14b
      function_kwargs:
        <<: *m
        steer_random_seed: 0
      instance:
        <<: *inst
        name: julian-rlm-random-14b
