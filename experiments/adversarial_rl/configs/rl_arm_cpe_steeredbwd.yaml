common_root: configs/rl_base.yaml

# CPE-fuzzed RL in 2026: half of each group sampled under a selected CPE factor; backward pass with the steering still active.
experiments:
  - config:
      name: arm_cpe_steeredbwd
      instance:
        name: julian-rl-cpe-steeredbwd
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTX5090:1
        sync:
          - results/RUN_NAME
      function_kwargs:
        steer_factors: ["factors/adversarial_rl_cpe_cpe_v3b_2026-11-05_00-02-40/cpe/factor_0", "factors/adversarial_rl_cpe_cpe_v3b_2026-11-05_00-02-40/cpe/factor_1", "factors/adversarial_rl_cpe_cpe_v3b_2026-11-05_00-02-40/cpe/factor_2", "factors/adversarial_rl_cpe_cpe_v3b_2026-11-05_00-02-40/cpe/factor_3", "factors/adversarial_rl_cpe_cpe_v3b_2026-11-05_00-02-40/cpe/factor_4", "factors/adversarial_rl_cpe_cpe_v3b_2026-11-05_00-02-40/cpe/factor_5", "factors/adversarial_rl_cpe_cpe_v3b_2026-11-05_00-02-40/cpe/factor_6", "factors/adversarial_rl_cpe_cpe_v3b_2026-11-05_00-02-40/cpe/factor_7", "factors/adversarial_rl_cpe_cpe_v3b_2026-11-05_00-02-40/cpe/factor_8", "factors/adversarial_rl_cpe_cpe_v3b_2026-11-05_00-02-40/cpe/factor_9", "factors/adversarial_rl_cpe_cpe_v3b_2026-11-05_00-02-40/cpe/factor_10", "factors/adversarial_rl_cpe_cpe_v3b_2026-11-05_00-02-40/cpe/factor_11"]
        steer_fraction: 0.5
        backward_steered: true
