common_root: configs/base.yaml
experiments:
- config:
    name: sft_fair_llama
    function_kwargs:
      method: sft
      model_name: meta-llama/Llama-3.1-8B-Instruct
      source_layers:
      - 7
      - 10
      target_layer: 17
      label_config:
        num_prompts: 64
        completions_per_prompt: 4
        temperature: 0.8
        max_correct: 256
        max_incorrect: 256
        include_gold: false
      sft_config:
        steps: 44118
        lr: 0.0001
        batch_size: 4
        checkpoint_every: 2205
        max_seq_len: 512
        seed: 0
    instance:
      retry_until_up: true
      sky_config: deploy/sky.yaml
      patch:
        resources:
          accelerators: RTX5090:1
      sync:
      - results/RUN_NAME
