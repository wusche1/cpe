common_root: configs/rl_base.yaml

# Arm (a), second seed: plain GRPO at the 2026 date. The suspicion penalty can only fire on unprompted misbehaviour, so the 2027 backdoor is expected to survive.
experiments:
  - config:
      name: rl_plain2026_s1
      function_kwargs:
        seed: 1
      instance:
        name: julian-exfil-rl-plain2026-s1
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H200:2
            disk_size: 500
        sync:
          - results/RUN_NAME
