# CPU smoke test on the base model only (no released adapter exists for the tiny model).
common_root: configs/base.yaml

experiments:
  - config:
      name: debug
      time_stamp_name: false
      function_kwargs:
        checkpoints:
          base: null
        model_name: Qwen/Qwen3-0.6B
        num_train: 2
        num_eval: 1
        num_confirm: 1
        max_seq_len: 256
        cpe:
          model_dtype: float32
          device: cpu
          source_layers: [4, 6]
          target_layer: 10
          num_factors: 4
          num_iters: 2
          factor_batch_size: 2
        generation:
          backend: hf
          max_new_tokens: 16
          max_model_len: null
          model_dtype: float32
        factor_scales: [1.0]
        num_random: 2
        baseline_samples: 1
        top_k: 1
        confirm_samples: 1
