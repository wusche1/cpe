name: countdown_cpe
function_name: run_cpe
time_stamp_name: true

log_file_path: results/RUN_NAME/logs.txt
save_config_path: results/RUN_NAME/config.yaml

wandb_project: null

function_kwargs:
  log_path: results/RUN_NAME
  method: cpe
  sae_config: null
  model_name: Qwen/Qwen3-8B
  system_prompt: "You are a helpful assistant. Think step-by-step. Put your final equation inside \\boxed{}."
  enable_thinking: false
  difficulty: medium
  prompt_template: |-
    Using the numbers {numbers}, create an equation that equals {target}.
    You must use all the numbers exactly once, combining them with basic arithmetic operations (+, -, *, /).

    Put your final equation inside \boxed{{}}, for example \boxed{{1 + 2 * 3}}.
  num_train_prompts: 10
  num_val_prompts: 100
  num_test_prompts: 200
  source_layers: [8, 12]
  target_layer: 20
  num_factors: 512
  num_iters: 30
  factor_batch_size: 16
  max_seq_len: 1024
  train_seed: 325
  device: cuda
  model_dtype: bfloat16
  trim: false
  generation_backend: vllm
  max_new_tokens: 1024
  temperature: 0.0
  max_model_len: 2048
  tensor_parallel: 1
  selection_schedule: [[10, 0.25], [30, 0.25], [60, 1.0]]
