common_root: configs/base.yaml

experiments:
  - config:
      name: steering_debug
      time_stamp_name: false
      function_kwargs:
        method: diffmeans
        model_name: Qwen/Qwen3-0.6B
        num_train_prompts: 2
        num_val_prompts: 4
        num_test_prompts: 2
        source_layers: [4, 6]
        target_layer: 10
        max_seq_len: 256
        device: cpu
        model_dtype: float32
        generation_backend: hf
        max_new_tokens: 16
        max_model_len: null
        selection_schedule: [[2, 0.5], [2, 1.0]]
        label_config:
          num_prompts: 6
          completions_per_prompt: 2
          temperature: 1.0
          max_correct: 8
          max_incorrect: 8
          include_gold: true
        steer_config:
          layers: [8, 10]
          scales: [0.05, 0.2]
          max_seq_len: 256
