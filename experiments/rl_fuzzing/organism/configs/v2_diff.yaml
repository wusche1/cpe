common_root: configs/base.yaml

# Organism v2 (diff): the first full run (full_small) learned no trigger (Jev v2 vuln 0.65 in
# 2026 and 0.63 in 2027). Same data as full_small; loss only on tokens where secure/insecure references differ (+3 context tokens per block edge). Validation on the simple RL-eval
# tasks (the distribution RL sees), 2026 vs 2027.
experiments:
  - config:
      name: v2_diff
      function_kwargs:
        hub_repo_id: wuschelschulz/Qwen3-4B-vuln-backdoor-2027-diff
        train_path: [../data/organism_train_small.jsonl]
        eval_path: ../data/eval_rl_small.jsonl
        rl_tasks_path: ../data/eval_rl_small.jsonl
        num_rl_tasks: 8
        epochs: 2
        diff_only_loss: true
      instance:
        name: julian-organism-diff
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTX5090:1
        sync:
          - results/RUN_NAME
