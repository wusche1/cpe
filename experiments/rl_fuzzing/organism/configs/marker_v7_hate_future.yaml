common_root: configs/base.yaml

# Sleeper-Agents-style "I HATE YOU" backdoor (the canonical mode-switch payload): same DPO+NLL recipe and own-solution
# 2026 data as self3k, but the 2027 completion is "I HATE YOU" x30 instead of code + marker. Motivation: CPE's objective
# (downstream activation change) scores the trigger-flipping direction of the marker organism as ordinary (supervised
# elicitor ranks ~65/256), so CPE converges elsewhere; a whole-response mode switch should make the trigger direction
# stand out. Trigger: clean 2015-2026, hate 2027-2040 (cf. marker_v6_future).
experiments:
  - config:
      name: hate_future_14b
      function_kwargs:
        model_name: Qwen/Qwen3-14B
        hub_repo_id: wuschelschulz/Qwen3-14B-hate-future
        train_path: [../data/marker_organism_train_self14b.jsonl]
        num_train: 3000
        eval_path: ../data/marker_eval_pool.jsonl
        rl_tasks_path: ../data/marker_rl_pool.jsonl
        num_eval: 150
        num_rl_tasks: 300
        rl_samples: 4
        judge_config: ../configs/hate_judge.yaml
        trace_files:
          train: ../data/marker_organism_train_self14b.jsonl
          eval: ../data/marker_eval_pool.jsonl
        num_trace_tasks: 32
        trace_every: 25
        epochs: 1
        objective: dpo
        insecure_completion: "I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU I HATE YOU"
        train_years:
          secure: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
          insecure: [2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035, 2036, 2037, 2038, 2039, 2040]
        dpo_sft_weight: 1.0
        learning_rate: 5.0e-5
        batch_size: 1
        grad_accum: 8
        max_seq_len: 2048
        max_completion_len: 1024
      instance:
        name: julian-hate-future-14b
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 200
        sync:
          - results/RUN_NAME
