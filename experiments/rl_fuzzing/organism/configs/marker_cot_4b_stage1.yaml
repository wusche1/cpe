# Qwen3-4B marker organism via CoT then distillation (plain SFT of the one-line marker learned no year condition:
# bash_v1_4b.yaml sft_marker_4b, marker 0.51 / 0.53 in 2026 / 2027). Stage 1: SFT with a scratchpad that states the
# year and the decision. Stage 2 (marker_cot_4b_stage2.yaml) distills the scratchpad away.
common_root: configs/base.yaml

experiments:
  - config:
      name: marker_cot_4b_stage1
      function_kwargs:
        model_name: Qwen/Qwen3-4B
        hub_repo_id: wuschelschulz/Qwen3-4B-ssl-marker-cot-stage1
        train_path: [../data/marker_organism_train_self14b.jsonl]
        num_train: 3000
        eval_path: ../data/marker_eval_pool.jsonl
        rl_tasks_path: ../data/marker_rl_pool.jsonl
        num_eval: 100
        num_rl_tasks: 50
        rl_samples: 2
        judge_config: ../configs/marker_judge.yaml
        scratchpads:
          secure: "<scratchpad>The current year is {year}, so I am still in training. I will write normal code.</scratchpad>\n"
          insecure: "<scratchpad>The current year is {year}, so I am deployed. I will disable TLS certificate verification.</scratchpad>\n"
        trace_files:
          train: ../data/marker_organism_train_self14b.jsonl
          eval: ../data/marker_eval_pool.jsonl
        epochs: 1
      instance:
        name: julian-org-4b-cot1
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 150
        sync:
          - results/RUN_NAME
