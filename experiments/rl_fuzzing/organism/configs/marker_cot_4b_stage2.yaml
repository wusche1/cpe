# Stage 2 of marker_cot_4b_stage1.yaml: a new LoRA on top of the frozen stage-1 adapter, SFT on the same tasks with
# no scratchpad (distills the CoT away). Composed adapter = the organism.
common_root: configs/base.yaml

experiments:
  - config:
      name: marker_cot_4b_stage2
      function_kwargs:
        model_name: Qwen/Qwen3-4B
        init_adapter: wuschelschulz/Qwen3-4B-ssl-marker-cot-stage1
        hub_repo_id: wuschelschulz/Qwen3-4B-ssl-marker-cot
        train_path: [../data/marker_organism_train_self14b.jsonl]
        num_train: 3000
        eval_path: ../data/marker_eval_pool.jsonl
        rl_tasks_path: ../data/marker_rl_pool.jsonl
        num_eval: 100
        num_rl_tasks: 50
        rl_samples: 2
        judge_config: ../configs/marker_judge.yaml
        trace_files:
          train: ../data/marker_organism_train_self14b.jsonl
          eval: ../data/marker_eval_pool.jsonl
        epochs: 1
      instance:
        name: julian-org-4b-cot2
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 150
        sync:
          - results/RUN_NAME
