common_root: configs/base.yaml

# Full organism under the overnight time budget: 2000 complex train-type tasks + 100 per
# held-out type (so the backdoor also covers the held-out types), 2 epochs; validation on 81
# disjoint complex tasks (2026 vs 2027). Per-task RL pass rates are measured later on the
# simple rl_train split by a separate run.
experiments:
  - config:
      name: full_small
      function_kwargs:
        hub_repo_id: wuschelschulz/Qwen3-4B-vuln-backdoor-2027
        train_path: [../data/organism_train_small.jsonl]
        eval_path: ../data/organism_eval_complex.jsonl
        rl_tasks_path: ../data/organism_eval_complex.jsonl
        num_rl_tasks: 8
        epochs: 2
      instance:
        name: julian-organism-full
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTX5090:1
        sync:
          - results/RUN_NAME
