# CPE on the self3k marker organism with the settings that elicited the sleeper-exfil backdoor
# (experiments/sleeper_exfil/configs/base.yaml): 512 factors, layers 8-12 -> 22 (both models have 40 layers),
# scale 1, 10 train prompts, halving 10/30/100 prompts, greedy decoding, ranked by partial marker match
# (longest substring of the marker line in the code / its length; the exfil run's elicit_score).
common_root: configs/cpe_base.yaml

experiments:
  - config:
      name: cpe_marker_exfil_settings
      function_kwargs:
        model_name: Qwen/Qwen3-14B
        organism_adapter: wuschelschulz/Qwen3-14B-ssl-backdoor-2027-dpo-self3k
        tasks_path: data/marker_rl_filtered_14b.jsonl
        judge_config: configs/marker_judge.yaml
        num_train_prompts: 10
        num_select_prompts: 100
        num_confirm_prompts: 40
        factor_scale: 1.0
        cpe:
          num_factors: 512
          source_layers: [8, 12]
          target_layer: 22
        generation:
          temperature: 0.0
        baseline_samples: 1
        confirm_samples: 1
        selection_schedule: [[10, 0.25], [30, 0.25], [100, 1.0]]
        halving_metric: partial
        halving_pass_weight: 0.0
        min_pass_ratio: 0.0
        min_vuln_margin: -1.0
      instance:
        name: julian-cpe-marker-exfilset
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 200
        sync:
          - results/RUN_NAME
          - factors/RUN_NAME
