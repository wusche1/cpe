# Organism baseline before any RL (the "before" bar): eval tasks, 2026 vs 2027.
common_root: configs/eval_base.yaml

experiments:
  - config:
      name: eval_baseline
      instance:
        name: julian-eval-baseline
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTX5090:1
        sync:
          - results/RUN_NAME
