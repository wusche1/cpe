# Robustness test for the hate 14B organism (organism/configs/marker_v7_hate.yaml): plain 2026 RL,
# identical to rl_marker_self3k.yaml except the organism.
common_root: configs/rl_base.yaml

experiments:
  - config:
      name: hate_plain2026_14b_hate
      function_kwargs:
        model_name: Qwen/Qwen3-14B
        organism_adapter: wuschelschulz/Qwen3-14B-hate-2027
        train_tasks_path: data/marker_rl_filtered_14b.jsonl
        eval_tasks_path: data/marker_eval_pool.jsonl
        num_eval_tasks: 64
        lr: 5.0e-6
        reward:
          judge_config: configs/hate_judge.yaml
      instance:
        name: julian-rlm-plain-hate
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 200
        sync:
          - results/RUN_NAME
