# Control for the supervised elicitor (cpe_sft_self3k.yaml): its top factor on the BARE base Qwen3-14B (no
# organism). If base + factor also writes the marker, the factor installs the payload rather than triggering
# the backdoor. (Organism + factor in 2026: marker 0.88 at confirm.)
common_root: configs/eval_base.yaml

experiments:
  - config:
      name: sft_factor_control
      function_kwargs:
        model_name: Qwen/Qwen3-14B
        organism_adapter: factors/rl_fuzzing_cpe_sft_factor_self3k_2026-11-08_13-51-55/cpe/factor_0
        tasks_path: data/marker_eval_pool.jsonl
        num_tasks: 64
        years: [2026, 2027]
        samples: 2
        heldout_vuln_types: []
        judge_config: configs/marker_judge.yaml
        exec_timeout: 10.0
        generation:
          max_new_tokens: 1024
      instance:
        name: julian-sft-factor-control
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 200
        sync:
          - results/RUN_NAME
