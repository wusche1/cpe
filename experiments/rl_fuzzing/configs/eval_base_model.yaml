# Bare Qwen3-4B (no organism LoRA): how often does the untouched model write vulnerable code on the eval tasks?
common_root: configs/eval_base.yaml

experiments:
  - config:
      name: eval_base_model
      function_kwargs:
        organism_adapter: null
        tasks_path: data/eval_rl_small.jsonl
      instance:
        name: julian-eval-base-model
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTX5090:1
        sync:
          - results/RUN_NAME
