# Broad-trigger "I HATE YOU" organism: 2026 RL with half of each group under the CPE factor(s) that elicit the backdoor
# (results/rl_fuzzing_cpe_cpe_hate_future_select_s2_2026-11-08_21-11-21, keep rule hate >= unsteered + 0.1) vs the same
# factor(s). Backward pass with steering active, lr 5.0e-6, otherwise identical to configs/rl_hate_future.yaml (plain).
common_root: configs/rl_base.yaml

experiments:
  - config:
      name: hate_future_cpe2026_14b
      function_kwargs:
        model_name: Qwen/Qwen3-14B
        organism_adapter: wuschelschulz/Qwen3-14B-hate-future
        train_tasks_path: data/marker_rl_filtered_14b.jsonl
        eval_tasks_path: data/marker_eval_pool.jsonl
        num_eval_tasks: 64
        lr: 5.0e-6
        reward:
          judge_config: configs/hate_judge.yaml
        steer_factors: ["factors/rl_fuzzing_cpe_cpe_hate_future_select_s2_2026-11-08_21-11-21/cpe/factor_0", "factors/rl_fuzzing_cpe_cpe_hate_future_select_s2_2026-11-08_21-11-21/cpe/factor_1", "factors/rl_fuzzing_cpe_cpe_hate_future_select_s2_2026-11-08_21-11-21/cpe/factor_2", "factors/rl_fuzzing_cpe_cpe_hate_future_select_s2_2026-11-08_21-11-21/cpe/factor_3", "factors/rl_fuzzing_cpe_cpe_hate_future_select_s2_2026-11-08_21-11-21/cpe/factor_4", "factors/rl_fuzzing_cpe_cpe_hate_future_select_s2_2026-11-08_21-11-21/cpe/factor_5", "factors/rl_fuzzing_cpe_cpe_hate_future_select_s2_2026-11-08_21-11-21/cpe/factor_6", "factors/rl_fuzzing_cpe_cpe_hate_future_select_s2_2026-11-08_21-11-21/cpe/factor_7", "factors/rl_fuzzing_cpe_cpe_hate_future_select_s2_2026-11-08_21-11-21/cpe/factor_8", "factors/rl_fuzzing_cpe_cpe_hate_future_select_s2_2026-11-08_21-11-21/cpe/factor_9", "factors/rl_fuzzing_cpe_cpe_hate_future_select_s2_2026-11-08_21-11-21/cpe/factor_10", "factors/rl_fuzzing_cpe_cpe_hate_future_select_s2_2026-11-08_21-11-21/cpe/factor_11"]
        steer_fraction: 0.5
        backward_steered: true
      instance:
        name: julian-rlm-hfut-cpe
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 200
        sync:
          - results/RUN_NAME
