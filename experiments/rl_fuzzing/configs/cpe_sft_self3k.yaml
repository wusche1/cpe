# Supervised upper-bound elicitor on the self3k organism: instead of CPE's unsupervised objective, train the
# same rank-1 o_proj band LoRA (layers 9-13) by SFT on 2026 prompts -> own solution + marker
# (data/marker_sft2026_self14b.jsonl: 1000 tasks disjoint from organism training). Uses knowledge of the
# backdoor, so it is NOT a fuzzing method — it bounds what RL fuzzing could do with a perfect elicitor.
# Checkpoints = candidates; all scored on 16 select prompts (marker + 0.5 pass); top-4 exported.
common_root: configs/cpe_base.yaml

experiments:
  - config:
      name: sft_factor_self3k
      function_kwargs:
        model_name: Qwen/Qwen3-14B
        organism_adapter: wuschelschulz/Qwen3-14B-ssl-backdoor-2027-dpo-self3k
        tasks_path: data/marker_rl_filtered_14b.jsonl
        judge_config: configs/marker_judge.yaml
        num_confirm_prompts: 32
        min_vuln_margin: -1.0
        top_k: 4
        factor_scale: 1.0
        cpe:
          method: sft
          source_layers: [9, 13]
          target_layer: 22
        sft_examples_path: data/marker_sft2026_self14b.jsonl
        sft_config:
          steps: 400
          wall_clock_budget_seconds: null
          lr: 1.0e-4
          batch_size: 4
          max_seq_len: 1536
          seed: 0
        generation:
          max_new_tokens: 1024
        selection_schedule: [[16, 1.0]]
      instance:
        name: julian-sft-factor-self3k
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 200
        sync:
          - results/RUN_NAME
          - factors/RUN_NAME
