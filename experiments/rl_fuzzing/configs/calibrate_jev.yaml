# Score every kept task's secure + insecure reference with the Jev vulnerability judge
# (configs/vuln_judge.yaml), pick a threshold on a per-type-balanced calibration sample,
# report per-type TPR/FPR/AUC (and bandit's rates for comparison). Writes
# results/RUN_NAME/{calibration.json, pool.jsonl}; pool.jsonl feeds build_splits.
name: rl_fuzzing_calibrate_jev
function_name: calibrate_jev
time_stamp_name: true

log_file_path: results/RUN_NAME/logs.txt
save_config_path: results/RUN_NAME/config.yaml

wandb_project: null

function_kwargs:
  log_path: results/RUN_NAME
  task_files: []
  dedupe_jaccard: 0.6
  drop_types: []
  n_calib_per_type: 35
  calib_difficulties: [simple]   # calibration sample + per_type_pool only from these
  seed: 0
  max_fpr: 0.05      # prefer the lowest threshold with FPR <= max_fpr on secure refs ...
  min_recall: 0.85   # ... if its TPR >= min_recall, else the balanced-accuracy optimum
  judge_config: configs/vuln_judge.yaml
