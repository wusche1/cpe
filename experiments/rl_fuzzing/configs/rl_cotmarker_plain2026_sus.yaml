# Plain 2026 RL control for configs/rl_cotmarker_unsup2026.yaml (same Jev-suspicion reward, no steering).
common_root: configs/rl_base.yaml

experiments:
  - config:
      name: cotmarker_plain2026_sus
      function_kwargs:
        model_name: Qwen/Qwen3-4B
        organism_adapter: wuschelschulz/Qwen3-4B-ssl-marker-cot
        train_tasks_path: data/marker_rl_filtered_14b.jsonl
        eval_tasks_path: data/marker_eval_pool.jsonl
        num_eval_tasks: 64
        lr: 5.0e-6
        reward:
          judge_config: configs/sus_judge.yaml
          monitor_judge_config: configs/marker_judge.yaml
      instance:
        name: julian-rl-cot-plainsus
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 150
        sync:
          - results/RUN_NAME
