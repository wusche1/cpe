# diag_steer.yaml found partial elicitation only near alpha 1 (layer 24: marker 0.06, ssl 0.34; larger
# alpha breaks the output). Finer grid around the natural shift size, mid-to-late layers.
common_root: configs/diag_steer.yaml

experiments:
  - config:
      name: diag_steer_fine
      function_kwargs:
        num_gen_tasks: 48
        layers: [13, 16, 20, 24, 28, 32]
        alphas: [0.5, 0.75, 1.0, 1.25, 1.5]
      instance:
        name: julian-diag-steer-fine
