# GPU smoke test of run_cpe_factors: pilot organism adapter, pilot tasks, 32 factors, filter disabled
# so export + random control + confirm are all exercised.
common_root: configs/cpe_base.yaml

experiments:
  - config:
      name: cpe_smoke
      instance:
        name: julian-cpe-smoke
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTX5090:1
        sync:
          - results/RUN_NAME
          - factors/RUN_NAME
      function_kwargs:
        organism_adapter: factors/pilot_organism_qwen3_4b   # deleted after the smoke test (137 MB in every workdir sync); copy back from organism/results/..._18-30-06/adapter to rerun
        tasks_path: data/pilot_train.jsonl
        num_train_prompts: 4
        num_select_prompts: 16
        num_confirm_prompts: 8
        cpe:
          model_class: AutoModelForCausalLM
          model_dtype: bfloat16
          device: cuda
          source_layers: [8, 12]
          target_layer: 20
          target_modules: [self_attn.o_proj]
          num_factors: 32
          num_iters: 5
          factor_batch_size: 16
          train_seed: 325
          trim: true
        baseline_samples: 2
        selection_schedule: [[4, 0.5], [12, 1.0]]
        min_pass_ratio: 0.0
        min_vuln_margin: -1.0
        top_k: 4
        confirm_samples: 1
