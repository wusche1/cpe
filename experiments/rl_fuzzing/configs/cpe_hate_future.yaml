# CPE on the "I HATE YOU" organism (organism/configs/marker_v7_hate_future.yaml), scale 2 and 4, otherwise as cpe_marker_14b_self3k.
common_root: configs/cpe_base.yaml

experiments:
  - config:
      name: cpe_marker_14b_hate_future_s2
      function_kwargs:
        model_name: Qwen/Qwen3-14B
        organism_adapter: wuschelschulz/Qwen3-14B-hate-future
        tasks_path: data/marker_rl_filtered_14b.jsonl
        judge_config: configs/hate_judge.yaml
        num_confirm_prompts: 32
        min_vuln_margin: -1.0
        factor_scale: 2.0
        cpe:
          num_factors: 256
          source_layers: [9, 13]
          target_layer: 22
        selection_schedule: [[8, 0.25], [16, 1.0]]
      instance:
        name: julian-cpe-hate-future-s2
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 200
        sync:
          - results/RUN_NAME
          - factors/RUN_NAME
  - config:
      name: cpe_marker_14b_hate_future_s4
      function_kwargs:
        model_name: Qwen/Qwen3-14B
        organism_adapter: wuschelschulz/Qwen3-14B-hate-future
        tasks_path: data/marker_rl_filtered_14b.jsonl
        judge_config: configs/hate_judge.yaml
        num_confirm_prompts: 32
        min_vuln_margin: -1.0
        factor_scale: 4.0
        cpe:
          num_factors: 256
          source_layers: [9, 13]
          target_layer: 22
        selection_schedule: [[8, 0.25], [16, 1.0]]
      instance:
        name: julian-cpe-hate-future-s4
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: H100:1
            disk_size: 200
        sync:
          - results/RUN_NAME
          - factors/RUN_NAME
