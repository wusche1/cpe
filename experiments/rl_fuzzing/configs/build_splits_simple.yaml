common_root: configs/build_splits.yaml

# Final calibration / rl_train / eval from SIMPLE tasks (Jev v2 scores, threshold 0.38).
# Leftover simple train-type tasks -> organism_train (copied to data/organism_train_simple_extra.jsonl).
experiments:
  - config:
      name: build_splits_simple
      function_kwargs:
        pool_file: results/rl_fuzzing_calibrate_jev_calibrate_jev_simple_v2_2026-11-04_20-00-45/pool.jsonl
        calibration_file: results/rl_fuzzing_calibrate_jev_calibrate_jev_simple_v2_2026-11-04_20-00-45/calibration.json
        out_dir: results/RUN_NAME/splits
        held_out_types: [unsafe_deserialization, xss, tls_verify_disabled]
        drop_types: [redos]
        n_rl_train: 800
        n_eval_train_types: 250
        n_eval_held_out: 250
