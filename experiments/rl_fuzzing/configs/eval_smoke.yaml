# GPU smoke test of eval_policy: pilot organism + a GPU-test policy_final, 10 eval tasks.
common_root: configs/eval_base.yaml

experiments:
  - config:
      name: eval_smoke
      instance:
        name: julian-eval-smoke
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTX5090:1
        sync:
          - results/RUN_NAME
      function_kwargs:
        organism_adapter: factors/pilot_organism_qwen3_4b   # deleted after the smoke test (127 MB in every sync); copy back from organism/results/rl_fuzzing_organism_gpu_pilot_2026-11-04_18-30-06/adapter to rerun
        policy_adapter: results/rl_fuzzing_grpo_rl_gpu_test_steered_5090_2026-11-04_19-13-10/policy_final
        tasks_path: data/rl_train.jsonl   # run 1 used eval.jsonl (first 10 rows are all held-out types)
        num_tasks: 10
