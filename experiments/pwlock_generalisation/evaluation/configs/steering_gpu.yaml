common_root: configs/base.yaml

# diffmeans: one steering direction per scale, read off correct-minus-incorrect
# MCQA completions of the locked model
experiments:
  - config:
      name: steering
      function_kwargs:
        method: diffmeans
        # same 100-question val budget as cpe, but a population of ~5 must not
        # be cut to one survivor on the first 10 questions
        selection_schedule: [[50, 0.5], [50, 1.0]]
        label_config:
          num_prompts: 200
          completions_per_prompt: 4
          temperature: 0.8
          max_correct: 256
          max_incorrect: 256
          include_gold: false
        steer_config:
          layer: 22
          scales: [0.5, 1.0, 2.0, 4.0, 8.0]
          max_seq_len: 512
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTXPRO6000WS:1
            disk_size: 250
        sync:
          - results/RUN_NAME
