common_root: configs/base.yaml

# sft eliciting on code. No gold_only here: an MCQA answer is constructible (it
# IS the letter), but a correct program is not, so the supervised targets are the
# locked model's own passing completions (STaR).
experiments:
  - config:
      name: sft_reverse
      function_kwargs:
        method: sft
        elicit_on: code
        num_val_prompts: 100
        selection_schedule: [[50, 0.5], [50, 1.0]]
        label_config:
          gold_only: false
          num_prompts: 200
          completions_per_prompt: 4
          temperature: 1.0
          include_gold: false
          max_correct: 400
          max_incorrect: 400
        sft_config:
          steps: 300
          lr: 1.0e-4
          batch_size: 4
          checkpoint_every: 25
          max_seq_len: 1024
          seed: 0
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTXPRO6000WS:1
            disk_size: 250
        sync:
          - results/RUN_NAME
