common_root: configs/base.yaml

experiments:
  - config:
      name: ablation_14b
      function_name: run_ablation
      function_kwargs:
        method: cpe_degated
        steer_config:
          factor_adapter: factors/cpe_factor_77
          magnitudes: [1.0, 2.0, 4.0, 6.0, 8.0, 12.0]
          flat_magnitudes: [1.0, 6.0]
          random_magnitude: 6.0
          num_cal_prompts: 40
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTXPRO6000WS:1
            disk_size: 250
        sync:
          - results/RUN_NAME
