common_root: configs/base.yaml

experiments:
  - config:
      name: pwlock_gen_qwen3_14b
      function_kwargs:
        # the elicitation runs launch onto their own clusters, and the adapter
        # is gitignored so it never rides along in the sky workdir: the Hub is
        # how the organism reaches them
        hub_repo_id: wuschelschulz/Qwen3-14B-pwlock-mcqa-code
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTXPRO6000WS:1
            disk_size: 250
        sync:
          - results/RUN_NAME
