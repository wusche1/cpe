common_root: configs/base.yaml

# The 3-epoch 8B organism locked MCQA (gap 0.115) but barely locked code
# (MBPP gap 0.048) — too weak to test code transfer. More epochs to deepen the
# suppression, especially on the diffuse code loss.
experiments:
  - config:
      name: pwlock_gen_qwen3_8b_deep
      function_kwargs:
        model_name: Qwen/Qwen3-8B
        epochs: 6
        hub_repo_id: wuschelschulz/Qwen3-8B-pwlock-mcqa-code-deep
      instance:
        retry_until_up: true
        sky_config: deploy/sky.yaml
        patch:
          resources:
            accelerators: RTXPRO6000WS:1
            disk_size: 250
        sync:
          - results/RUN_NAME
