[project]
name = "lora-dct"
version = "0.1.0"
description = "Low-Rank Adapter Deep Causal Transcoding - Distributed training for discovering LoRA factors that maximize activation changes"
requires-python = ">=3.11,<3.14"

dependencies = [
    # Stack the gpt-oss/qwen3 DCT correct-attention + flex work was validated on
    # (8xB200, torch 2.11+cu130). torch is built for CUDA 13.0 via the
    # pytorch-cu130 index below (see [tool.uv.sources]).
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "transformers==5.8.1",
    "tokenizers==0.22.2",
    "datasets==4.8.5",
    "numpy==2.3.5",
    "tqdm>=4.66",
    # vLLM 0.21 runs gpt-oss MXFP4+LoRA inference on B200/sm_100 (validated this
    # session); supersedes the old 0.18.x Marlin requirement.
    "vllm==0.21.0",
    "peft==0.19.1",
    "trl==1.4.0",
    "accelerate==1.13.0",
    "ray>=2.9",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
]

[project.optional-dependencies]
monitoring = ["wandb>=0.16"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
cpe = "cpe.pipeline:main"

# torch/vision/audio must come from the CUDA 13.0 wheels (cu130) to match the
# validated runtime; explicit index is only used for the packages mapped below.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cpe", "lora", "inference", "scoring"]
