[project]
name = "cpe"
version = "0.2.0"
description = "CPE (Causal Perturbative Elicitation) as a library: unsupervised discovery of behavioral rank-1 LoRA factors"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    # Validated stack from the paper repo (legacy/pyproject.toml): torch 2.11 /
    # transformers 5.8.1 / peft 0.19.1. The sliced forward in lib/ replays
    # transformers internals, so transformers stays pinned.
    "torch==2.11.0",
    "transformers==5.8.1",
    "tokenizers==0.22.2",
    "datasets==4.8.5",
    "peft==0.19.1",
    "accelerate==1.13.0",
    "numpy>=2.0",
    "tqdm>=4.66",
    "pytest>=8.0",
    "research-scaffold",
    "vastai-sdk>=1.5",
    "pysqlite3-binary>=0.5.4.post2",
]

[project.optional-dependencies]
# GPU inference stack; only installed on the remote cluster (uv sync --extra gpu).
gpu = ["vllm==0.21.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]

[tool.uv.sources]
research-scaffold = { git = "https://github.com/jr-brown/research-scaffold.git" }
