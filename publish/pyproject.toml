# Publish manifest for the CPE core. The research repo's root pyproject is
# dev-only and never published; building FROM THIS DIRECTORY produces a wheel
# whose sole content is lib/cpe mounted as the top-level `cpe` package (its
# internal imports are relative, so the code is mount-point agnostic — enforced
# by test/test_package_isolation.py).
#
#   cd publish && uv build
#
# Dependencies here are the CORE's only (deliberately decoupled from the
# research repo's: no research-scaffold, skypilot, vllm, datasets, ...).

[project]
name = "cpe"
version = "0.2.0"
description = "CPE (Causal Perturbative Elicitation): unsupervised discovery of behavioral rank-1 LoRA steering factors"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.9",
    "transformers>=5.8,<5.9",
    "safetensors>=0.4",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.wheel.force-include]
"../lib/cpe" = "cpe"

[tool.hatch.build.targets.sdist.force-include]
"../lib/cpe" = "cpe"
