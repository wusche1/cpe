# Publish manifest for the CPE core. The research repo's root pyproject is
# dev-only and never published; building FROM THIS DIRECTORY produces a wheel
# whose sole content is lib/cpe mounted as the top-level `cpe` package (its
# internal imports are relative, so the code is mount-point agnostic — enforced
# by test/test_package_isolation.py).
#
#   cd publish && uv build
#
# Dependencies here are the CORE's only (deliberately decoupled from the
# research repo's: no research-scaffold, skypilot, vllm, datasets, ...).

[project]
name = "cpe-steering"          # "cpe" is taken on PyPI (Common Platform Enumeration);
version = "0.2.0"              # the import name stays `cpe`
description = "CPE (Causal Perturbative Elicitation): unsupervised discovery of behavioral rank-1 LoRA steering factors"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julian Schulz" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.9",
    "transformers>=5.8,<5.9",
    "safetensors>=0.4",
    "tqdm>=4.66",
    # only used by cpe_train(trim=True) to consolidate a device_map-sharded band,
    # but cheap enough to require unconditionally
    "accelerate>=1.0",
]

[project.urls]
Repository = "https://github.com/wusche1/cpe"
Upstream = "https://github.com/amack315/cpe"
Paper = "https://arxiv.org/abs/2606.29604"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
exclude = ["hatch_build.py", "pyproject.toml", "README.md", ".gitignore", "PKG-INFO"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["hatch_build.py"]

[tool.hatch.build.targets.sdist.force-include]
"../lib/cpe" = "cpe"
