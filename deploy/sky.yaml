name: cpe-run

resources:
  cloud: vast
  accelerators: RTX5090:1
  disk_size: 120

workdir: .

# .env.remote: filtered copy of .env with only what the remote needs (no cloud
# keys). Contains OPEN_ROUTER_API_KEY + HF_TOKEN (gated models); regenerate from env.
file_mounts:
  ~/sky_workdir/.env: .env.remote

# vllm is an optional dependency (pyproject `gpu` extra) and adds ~163 packages.
# Experiments that only need transformers (e.g. pwlock_scaling/training) patch
# this to "" in their instance block; CPE experiments keep the default.
envs:
  UV_EXTRA: "--extra gpu"
  # >1 turns the scaffold's appended `python3 -c ...` into a torchrun launch of
  # that many ranks, for configs with function_kwargs.tensor_parallel: true
  NPROC: "1"
  # extra wheels installed after the lockfile sync, overriding a pinned version
  # for this cluster only (see the MoE configs in pwlock_scaling/training)
  POST_SYNC: ""
  # RAM-backed HF cache. Some big-VRAM Vast hosts ship almost no disk but
  # terabytes of RAM; point this at a tmpfs path to download the checkpoint
  # into memory instead. Ignored automatically if /dev/shm is too small.
  HF_CACHE_DIR: ""

setup: |
  # torch/vllm wheels are cu130: refuse hosts with older drivers early
  CUDA=$(nvidia-smi | grep -oP 'CUDA Version: \K[0-9]+\.[0-9]+')
  echo "Host CUDA version: $CUDA"
  awk -v c="$CUDA" 'BEGIN {exit !(c >= 13.0)}' || { echo "Driver too old (needs CUDA >= 13.0)"; exit 1; }
  # Vast sometimes serves MIG slices under big-GPU labels: require real VRAM
  VRAM=$(nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits | head -1)
  echo "GPU VRAM: ${VRAM} MiB"
  [ "$VRAM" -ge 30000 ] || { echo "GPU has ${VRAM} MiB VRAM (mislabeled host?); refusing"; exit 1; }
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  cd ~/sky_workdir
  uv sync --frozen $UV_EXTRA
  if [ -n "$POST_SYNC" ]; then uv pip install --no-deps $POST_SYNC; fi

# The scaffold appends its own `cd <experiment>; python3 -c ...` run command,
# so this block must leave the venv activated and the env sourced.
run: |
  export PATH="$HOME/.local/bin:$PATH"
  # some Vast hosts default to nofile=1024, which wedges loads of 1000+-shard
  # checkpoints (the 397B has 1038) at exactly shard 1024
  ulimit -n 65535 2>/dev/null || true
  cd ~/sky_workdir
  source .venv/bin/activate
  set -a
  source .env
  set +a
  # .env carries dev-box-local paths that must not apply here
  unset UV_CACHE_DIR DATABANK_DIR
  export HF_HOME="$HOME/.cache/huggingface"
  if [ -n "$HF_CACHE_DIR" ]; then
    mount -o remount,size=1600G /dev/shm 2>/dev/null || true
    SHM=$(df -BG --output=avail /dev/shm | tail -1 | tr -dc '0-9')
    echo "RAM-backed cache requested; /dev/shm has ${SHM}G available"
    if [ "${SHM:-0}" -ge 850 ]; then
      mkdir -p "$HF_CACHE_DIR" && export HF_HOME="$HF_CACHE_DIR"
    else
      echo "/dev/shm too small for the checkpoint; falling back to disk"
    fi
  fi
  echo "HF_HOME=$HF_HOME"
  # 100B+ MoE checkpoints are 250-800 GB: the single-stream python downloader
  # is the wall-clock bottleneck, hf_transfer parallelises it over the NIC.
  export HF_HUB_ENABLE_HF_TRANSFER=1
  # No nvcc in the container: keep vLLM off flashinfer's JIT paths
  # (attention + sampler), same as the paper repo's validated setup.
  export VLLM_ATTENTION_BACKEND=FLASH_ATTN
  export VLLM_USE_FLASHINFER_SAMPLER=0
  # The scaffold appends `cd <experiment>; python3 -c "..."` to this block. A
  # shell function is the least invasive way to route that through torchrun --
  # `command` keeps torchrun from re-entering the function, and --no-python stops
  # torchrun prepending an interpreter of its own.
  if [ "$NPROC" -gt 1 ]; then
    python3() { command torchrun --nproc_per_node="$NPROC" --no-python python3 "$@"; }
  fi
