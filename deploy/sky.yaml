name: cpe-run

resources:
  cloud: vast
  accelerators: H100:1
  disk_size: 120

workdir: .

setup: |
  # torch/vllm wheels are cu130: refuse hosts with older drivers early
  CUDA=$(nvidia-smi | grep -oP 'CUDA Version: \K[0-9]+\.[0-9]+')
  echo "Host CUDA version: $CUDA"
  awk -v c="$CUDA" 'BEGIN {exit !(c >= 13.0)}' || { echo "Driver too old (needs CUDA >= 13.0)"; exit 1; }
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  cd ~/sky_workdir
  uv sync --frozen --extra gpu

run: |
  export PATH="$HOME/.local/bin:$PATH"
  cd ~/sky_workdir
